name: alpy_yedekleme
description: Alpy Yedekleme - uygulama yedekleme ve geri yukleme
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/wall.jpg
  fonts:
    - family: Minecraft
      fonts:
        - asset: assets/fonts/Minecraft-1.ttf
