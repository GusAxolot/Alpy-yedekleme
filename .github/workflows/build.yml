name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android iskeletini olustur ve dosyalari yerlestir
        run: |
          flutter create --org com.alpy --project-name alpy_yedekleme --platforms android build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp android_overlay/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          mkdir -p build_app/android/app/src/main/kotlin/com/alpy/alpy_yedekleme
          cp android_overlay/MainActivity.kt build_app/android/app/src/main/kotlin/com/alpy/alpy_yedekleme/MainActivity.kt
          F=build_app/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' $F
          printf '\ndependencies {\n    implementation("dev.rikka.shizuku:api:13.1.5")\n    implementation("dev.rikka.shizuku:provider:13.1.5")\n}\n' >> $F
      - name: Derle
        working-directory: build_app
        run: |
          flutter pub get
          PC="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PC/hosted" -path '*/android/build.gradle' -exec sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdkVersion 36/' {} +
          find "$PC/hosted" -path '*/android/build.gradle.kts' -exec sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk = 36/' {} +
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Alpy-Yedekleme-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
